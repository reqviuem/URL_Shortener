<div class="row">
  <div class="col-12">
    <h2 class="mb-4">Shortened URLs</h2>

    <div class="card mb-4" *ngIf="isLoggedIn">
      <div class="card-header bg-light">
        <h5 class="mb-0">Add New URL</h5>
      </div>
      <div class="card-body">

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="addUrl()" class="d-flex gap-2">
          <input
            type="url"
            class="form-control"
            placeholder="Enter long URL here (e.g., https://example.com/something-very-long)"
            [(ngModel)]="newUrl"
            name="newUrl"
            required>
          <button type="submit" class="btn btn-success" [disabled]="!newUrl">Shorten</button>
        </form>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
          <th>Original URL</th>
          <th>Shortened URL</th>
          <th>Created By</th>
          <th class="text-center">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let url of urls">

          <td class="text-truncate" style="max-width: 300px;" title="{{ url.originalUrl }}">
            <a [href]="url.originalUrl" target="_blank">{{ url.originalUrl }}</a>
          </td>

          <td>
            <strong>{{ url.shortenedUrl }}</strong>
          </td>

          <td>{{ url.createdBy }}</td>

          <td class="text-center">
            <a class="btn btn-sm btn-info me-2 text-white" [routerLink]="['/urls', url.id]">
              Info
            </a>

            <button
              class="btn btn-sm btn-danger"
              *ngIf="canDelete(url)"
              (click)="deleteUrl(url.id)">
              Delete
            </button>

          </td>
        </tr>

        <tr *ngIf="urls.length === 0">
          <td colspan="4" class="text-center text-muted py-4">
            No URLs found.
            <span *ngIf="!isLoggedIn">Log in to add one!</span>
            <span *ngIf="isLoggedIn">Be the first to add one above!</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
